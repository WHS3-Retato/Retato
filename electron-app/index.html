<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Retato</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="sidebar" class="container">
      <div class="menu_box">
        <div class="logo_section">
          <img src="icon_logo.svg" alt="앱로고" class="logo_icon"/>
          <span class="logo_text">RETATO</span>
        </div>

        <ul class="menu_list">
          <li><a href="index.html" class="menu_item">
            <img src="icon_home.svg" alt="HOME 아이콘" class="menu_icon">HOME</a></li>
          <li><a href="fileUpload.html" class="menu_item">
            <img src="icon_recovery.svg" alt="Recovery 아이콘" class="menu_icon">Recovery</a></li>
          <li><a href="setting.html" class="menu_item">
            <img src="icon_setting.svg" alt="Setting 아이콘" class="menu_icon">Setting</a></li>
          <li><a href="information.html" class="menu_item">
            <img src="icon_information.svg" alt="information 아이콘" class="menu_icon">information</a></li>
        </ul>
      </div>
      
      <div class="main_content">
        <h1>드라이브를 선택해 복원을 시작하세요.</h1>

        <div class="drive_wrapper">
          <div class="drive_category">
            <h2>내장 드라이브</h2>
            <div id="internal_list"></div>
          </div>

          <div class="drive_category external_drive">
            <h2>외장 드라이브</h2>
            <div id="external_list"></div>
          </div>

          <div class="drive_category portable_drive">
            <h2>이동식 드라이브</h2>
            <div id="portable_list"></div>
          </div>
        </div>
        <!-- 선택된 드라이브 파일 탐색 영역 -->
        <section id="explorer" class="explorer_container"></section>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
